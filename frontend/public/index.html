<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Meetup</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #222);
      transition: background 0.3s, color 0.3s;
    }
    .card {
      text-align: center;
      padding: 2rem;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, #fff);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 360px;
      width: 90%;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .counter {
      font-size: 3rem;
      font-weight: 700;
      color: var(--tg-theme-button-color, #3390ec);
      margin: 1rem 0;
    }
    button {
      display: block; width: 100%;
      padding: 14px;
      border: none; border-radius: 10px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 1rem; font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: var(--tg-theme-hint-color, #999); }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Welcome to Meetup</h1>
    <p>People clicked the button:</p>
    <div class="counter" id="counter">...</div>
    <button id="btn" onclick="increment()">Tap me!</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_BASE = '__API_BASE__';

    async function fetchCounter() {
      try {
        const res = await fetch(`${API_BASE}/api/counter`);
        const data = await res.json();
        document.getElementById('counter').textContent = data.count;
      } catch (e) {
        document.getElementById('counter').textContent = '--';
        setStatus('Failed to load counter');
      }
    }

    async function increment() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      setStatus('Sending...');

      try {
        const res = await fetch(`${API_BASE}/api/counter/increment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData || '',
            userId: tg.initDataUnsafe?.user?.id || 'anonymous',
          }),
        });
        const data = await res.json();
        document.getElementById('counter').textContent = data.count;
        tg.HapticFeedback?.impactOccurred('medium');
        setStatus('');
      } catch (e) {
        setStatus('Error: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    fetchCounter();
  </script>
</body>
</html>
